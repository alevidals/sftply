name: sftply-integration

x-pure-ftpd: &pure-ftpd
  build:
    context: ./pure-ftpd
  image: sftply/pure-ftpd-test:latest
  restart: "no"

services:
  ftp:
    <<: *pure-ftpd
    ports:
      - "2121:21"
      - "30000-30099:30000-30099"
    environment:
      FTP_USER: sftply
      FTP_PASSWORD: sftply-test
      FTP_HOME: /home/ftpuser
      FTP_PASSIVE: 30000:30099
      FTP_TLS: "0"
    volumes:
      - ftp-data:/home/ftpuser

  ftps-explicit:
    <<: *pure-ftpd
    ports:
      - "2122:21"
      - "30100-30199:30100-30199"
    environment:
      FTP_USER: sftply
      FTP_PASSWORD: sftply-test
      FTP_HOME: /home/ftpuser
      FTP_PASSIVE: 30100:30199
      FTP_TLS: "1"
    volumes:
      - ftps-explicit-data:/home/ftpuser
      - ./certs/pure-ftpd.pem:/etc/ssl/private/pure-ftpd.pem:ro

  ftps-implicit:
    build:
      context: ./pure-ftpd-implicit
    image: sftply/pure-ftpd-implicit-test:latest
    restart: "no"
    ports:
      - "2990:990"
      - "30200-30299:30200-30299"
    environment:
      FTP_USER: sftply
      FTP_PASSWORD: sftply-test
      FTP_HOME: /home/ftpuser
      FTP_PASSIVE: 30200:30299
      FTP_PORT: "990"
    volumes:
      - ftps-implicit-data:/home/ftpuser
      - ./certs/pure-ftpd.pem:/etc/ssl/private/pure-ftpd.pem:ro

  sftp:
    image: atmoz/sftp:alpine
    restart: "no"
    ports:
      - "2222:22"
    command: sftply:sftply-test:1001:1001:upload

volumes:
  ftp-data:
  ftps-explicit-data:
  ftps-implicit-data:
