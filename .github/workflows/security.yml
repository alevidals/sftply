name: Security

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.lock"
      - "src-tauri/.cargo/audit.toml"
      - "bun.lock"
      - "web/bun.lock"
      - ".github/workflows/security.yml"
  schedule:
    # Weekly: new advisories appear without any commit in this repository.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: JavaScript advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
      - name: Audit desktop dependencies
        run: bun audit --production --audit-level=moderate
      - name: Install landing dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Audit landing dependencies
        run: bun audit --production --audit-level=moderate
        working-directory: web

  rust:
    name: Rust advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Vulnerabilities fail the job. Unmaintained-crate warnings are reported
      # in the log but do not fail; accepted advisories live in
      # src-tauri/.cargo/audit.toml with a written rationale.
      - name: Audit Cargo.lock
        run: cargo audit
        working-directory: src-tauri
