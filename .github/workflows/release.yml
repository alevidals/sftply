name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            platform: macos-latest
          - name: linux-x64
            platform: ubuntu-22.04
            arch: x64
          - name: linux-arm64
            platform: ubuntu-22.04-arm
            arch: arm64
          - name: windows-x64
            platform: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            file
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check version consistency
        run: bun run version:check
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Universal macOS needs both architectures; the other runners build
          # natively.
          target: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          # Release builds run once per tag. Caching the release target dir
          # costs about 600 MB per runner (three of them) and filled the
          # repository's 10 GB cache budget, so these builds start cold.
          cache: false
      - name: Build macOS bundles
        if: runner.os == 'macOS'
        env:
          # Ad-hoc signing keeps Apple Silicon from reporting the downloaded
          # app as damaged. Replace with a Developer ID identity to notarize.
          APPLE_SIGNING_IDENTITY: "-"
        run: bun run tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: bun run tauri build --bundles appimage,deb
      - name: Build Windows bundles
        if: runner.os == 'Windows'
        run: bun run tauri build --bundles nsis

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(bun -p "require('./package.json').version")"
          mkdir -p artifacts
          ditto -c -k --keepParent \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/sftply.app" \
            "artifacts/sftply_${VERSION}_macos-universal_portable.zip"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "artifacts/sftply_${VERSION}_macos-universal.dmg"

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(bun -p "require('./package.json').version")"
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage \
            "artifacts/sftply_${VERSION}_linux-${{ matrix.arch }}.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb \
            "artifacts/sftply_${VERSION}_linux-${{ matrix.arch }}.deb"
          chmod +x "artifacts/sftply_${VERSION}_linux-${{ matrix.arch }}.AppImage"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = bun -p "require('./package.json').version"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive `
            -Path "src-tauri/target/release/sftply.exe" `
            -DestinationPath "artifacts/sftply_${version}_windows-x64_portable.zip"
          Copy-Item `
            "src-tauri/target/release/bundle/nsis/*-setup.exe" `
            "artifacts/sftply_${version}_windows-x64-setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish draft release
    # A manual run only validates the builds. Pushing a v* tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
