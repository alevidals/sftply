name: sftply-dev-ftp

services:
  ftp:
    build:
      context: .
    image: sftply/dev-ftp:latest
    restart: unless-stopped
    # Debian's pure-ftpd tries to keep these capabilities; Docker drops them
    # by default, which makes the daemon exit with status 252.
    cap_add:
      - SYS_NICE
      - DAC_READ_SEARCH
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"
    environment:
      FTP_USER: sftply
      FTP_PASSWORD: sftply-dev
      FTP_HOME: /home/ftpuser
      FTP_PASSIVE: 30000:30009
      # Override with FTP_PUBLIC_IP=<host LAN address> to connect from another
      # device: PASV replies must point at the Mac, not at the client's loopback.
      FTP_PUBLIC_IP: ${FTP_PUBLIC_IP:-127.0.0.1}
    volumes:
      # A plain folder instead of a named volume: easy to inspect and reset.
      - ./data:/home/ftpuser
      # Read-only seed copied into the home on start when missing.
      - ./seed:/seed:ro
      # Bind the entrypoint so seed changes apply on restart without a rebuild.
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
