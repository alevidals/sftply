[package]
name = "sftply"
version = "1.1.0"
description = "A modern FTP, FTPS and SFTP desktop client"
authors = ["sftply"]
license = "MIT"
edition = "2024"
# Keep the bindings exporter in `examples/`, never in `src/bin/`: Tauri's
# universal macOS bundler copies every binary target and only `lipo`s the app.
default-run = "sftply"

[lib]
name = "sftply_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "fs", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
globset = "0.4"
# Manual update check only; see src/update.rs.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Protocol adapters (pinned; see docs/DEPENDENCIES.md)
suppaftp = { version = "=12.2.1", features = ["tokio-rustls-ring", "deprecated"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "=3.0.1"
keyring = "=4.2.0"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "=0.7.1"
rustls-pemfile = "2"
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
